name: CI

# Runs after every push, and on demand from the Actions tab ("Run workflow")
on:
  push:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: controle_caixa_test
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Run tests
        env:
          NODE_ENV: test
          PORT: 3000
          FRONTEND_URL: http://localhost:5173
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: ci
          DB_PASSWORD: ci
          DB_NAME: controle_caixa_test
          JWT_SECRET: ci-jwt-secret
          JWT_EXPIRATION: 15m
          JWT_SECRET_REFRESH: ci-jwt-refresh-secret
          JWT_EXPIRATION_REFRESH: 7d
          JWT_RESET_SECRET: ci-jwt-reset-secret
          SEND_LOGS: false
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
